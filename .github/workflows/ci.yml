name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both platforms on purpose: the project is developed on Windows, and the
    # Windows-specific runtime code must not break the Linux path.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Same extras as the development setup, minus stt: type checking has to
        # see the same type information the developer sees, or CI and the local
        # run disagree about code that never changed. The stt extra is left out
        # because it pulls several hundred megabytes of CUDA wheels.
        run: pip install -e ".[dev,audio]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      - name: Smoke test the pipeline
        run: voxlab smoke
